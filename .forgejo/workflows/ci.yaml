#
# circus CI gate (Forgejo Actions), on every push to main and every pull
# request. The same checks ./release.sh gates on locally: the full suite,
# rustfmt, and clippy.
#
# What makes this pipeline unusual is the composition boundary. circus invokes
# Git, tmux, and withdone as external programs and never substitutes an
# internal implementation (SPEC-001-circus-agent-harness#REQ-007), and its
# 55-entry spec suite drives all three for real rather than mocking them —
# Constitutional Principle 5. So the runner needs all three installed, and the
# job checks for them before running anything: a missing tool should say so
# once, up front, instead of fifteen tests exiting 127 apiece.
#
# Runner notes, taken from ../selfsame and ../hark rather than assumed: the
# Forgejo runner image ships node, git, and curl, but NOT rustup, NOT a C
# toolchain, and NOT necessarily `sudo`. Every step that needs one installs it
# and guards the privilege escalation.
#
# circus has no path dependencies, so unlike the sibling pipelines there are no
# sibling checkouts to clone and no revisions to pin — `--locked` fixes the
# whole tree on its own.

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  # withdone is a single POSIX shell script, not a published binary, and it is
  # fetched at a pinned commit rather than from a branch. Its completion
  # semantics are load-bearing for circus: ADR-009 turns on exactly when
  # withdone reaps the process group relative to the child's own exit, so an
  # upstream change there would silently alter what the suite proves. Bump this
  # deliberately.
  WITHDONE_REF: 3c1ce951a13a960c4336b67395b4b80072dbed7a
  # A short socket directory. A Unix domain socket path caps near 104 bytes and
  # tmux builds its socket path from this, so a deep default fails in a way
  # that reads as a tmux bug rather than a path-length one. It cost an hour
  # during development; it costs one line here.
  TMUX_TMPDIR: /tmp/tmux-ci
  # CI never runs a debugger, and debug info for the test binaries is the bulk
  # of the target tree. Incremental caching is pure disk waste on a one-shot
  # build. Local builds are unaffected: this is the CI environment, not
  # Cargo.toml.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    runs-on: ubuntu-latest
    # A hang and a slow runner are indistinguishable from the outside, and this
    # instance serves no logs, so an unbounded job is a run nobody can read.
    # The suite takes ~40s locally; 25 minutes is generous for a cold build on
    # a shared runner and still bounds a genuine hang.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Report the runner environment
        # First, and cannot fail. With no log endpoint on this instance, a run
        # that dies in the next step is otherwise indistinguishable from one
        # that dies in the last, so record what we are standing on before
        # touching anything.
        continue-on-error: true
        run: |
          {
            echo "MARKER: environment"
            . /etc/os-release 2>/dev/null && echo "os: ${PRETTY_NAME:-unknown}"
            echo "whoami: $(id -un 2>/dev/null || echo '?')  uid: $(id -u 2>/dev/null || echo '?')"
            for p in apt-get sudo curl git tmux ps python3 cc rustup cargo; do
              printf '%s=%s ' "$p" "$(command -v "$p" >/dev/null 2>&1 && echo yes || echo NO)"
            done
            echo
          } 2>&1 | tee -a /tmp/circus-ci.log

      - name: Install the C toolchain and the programs circus composes
        run: |
          echo "MARKER: apt" >> /tmp/circus-ci.log
          set -euo pipefail
          if ! command -v apt-get >/dev/null 2>&1; then
            echo "This job needs apt-get to install tmux, which circus invokes." >&2
            exit 1
          fi
          SUDO=""; command -v sudo >/dev/null 2>&1 && SUDO="sudo"
          $SUDO apt-get update
          # build-essential: rustc needs a linker even with no C dependencies.
          # tmux: the pane a launched agent runs in.
          # procps: `ps`, which the process-group residue of OBS-003 is counted with.
          # python3: one lock test probes flock through it, and skips without it.
          $SUDO apt-get install -y --no-install-recommends \
            build-essential pkg-config curl tmux procps python3 2>&1 \
            | tail -5 | tee -a /tmp/circus-ci.log

      - name: Install withdone
        # The explicit completion channel, and a single POSIX shell script —
        # there is no installer to pipe and nothing published to
        # files.anuna.io. The first version of this step assumed both and 404'd
        # into `sh`, which is what the ci-diagnostic step caught.
        run: |
          echo "MARKER: withdone" >> /tmp/circus-ci.log
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://git.anuna.io/anuna-research/withdone/raw/commit/${WITHDONE_REF}/withdone" \
            -o "$HOME/.local/bin/withdone"
          chmod +x "$HOME/.local/bin/withdone"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/withdone" --version 2>&1 | tee -a /tmp/circus-ci.log

      - name: Ensure the Rust toolchain
        run: |
          echo "MARKER: rustup" >> /tmp/circus-ci.log
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
              | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain || rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy
          rustc --version
          cargo --version

      - name: Confirm the composition boundary is satisfied
        # Fail here, legibly and once, rather than fifteen times as exit 127
        # inside the suite. REQ-007.a says circus invokes these rather than
        # reimplementing them; this is that requirement checked on the runner.
        run: |
          echo "MARKER: boundary" >> /tmp/circus-ci.log
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.cargo/bin:$PATH"
          missing=""
          for p in git tmux withdone ps; do
            command -v "$p" >/dev/null 2>&1 || missing="$missing $p"
          done
          if [ -n "$missing" ]; then
            echo "circus composes these and they are not installed:$missing" >&2
            exit 1
          fi
          git --version && tmux -V && withdone --version

      - name: Configure Git for the fixtures
        # The suite drives Git for real, and Git refuses to commit without an
        # identity. Each fixture repository sets its own; this covers anything
        # that reaches a global.
        run: |
          git config --global user.email ci@anuna.io
          git config --global user.name "circus CI"
          git config --global init.defaultBranch main

      # Registry only, deliberately not `target`. hark's pipeline cached both
      # and it filled the runner disk; the failure is not a clean "cache full"
      # either, but a half-restored target that blames the wrong crate. circus's
      # tree is far smaller, but a cold compile of three dependencies costs
      # seconds and is not worth the class of failure.
      - name: Cache the cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-circus-ci-v1-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-circus-ci-v1-

      - name: Test
        # ~15 of the 55 spec tests start a tmux pane. Each fixture sets its own
        # TMUX_TMPDIR inside its temporary directory, so they get one server
        # each and cannot collide.
        #
        # Bounded separately from the job: if the suite is what hangs, the
        # diagnostic step still gets to run and say so.
        timeout-minutes: 15
        run: |
          echo "MARKER: test" >> /tmp/circus-ci.log
          set -o pipefail
          mkdir -p "$TMUX_TMPDIR"
          cargo test --locked 2>&1 | tee -a /tmp/circus-ci.log

      - name: Formatting
        run: |
          echo "MARKER: fmt" >> /tmp/circus-ci.log
          set -o pipefail
          cargo fmt --check 2>&1 | tee -a /tmp/circus-ci.log

      - name: Clippy (deny warnings)
        run: |
          echo "MARKER: clippy" >> /tmp/circus-ci.log
          set -o pipefail
          cargo clippy --all-targets --locked -- -D warnings 2>&1 | tee -a /tmp/circus-ci.log

      - name: Boundary gates
        # `cargo test` above already ran both. Naming them makes the two
        # structural gates visible in the log rather than buried in a count:
        # tests/purity.rs enforces the Purity Boundary Map's dependency rule,
        # and tests/traceability.rs decides the requirement-attribution map.
        run: |
          echo "MARKER: gates" >> /tmp/circus-ci.log
          set -o pipefail
          cargo test --locked --test purity --test traceability 2>&1 | tee -a /tmp/circus-ci.log

      # This Forgejo exposes no log endpoint, so a failure is visible only as
      # "Failing after Nm", which is not enough to fix anything. Commit statuses
      # ARE readable through the API, so the first error line goes into one.
      # Borrowed from ../selfsame; delete it the day the instance grows a log
      # endpoint.
      - name: Report the first error into a commit status
        # This Forgejo exposes no log endpoint, so a failed run is visible only
        # as "Failing after Nm". Commit statuses ARE readable through the API,
        # so the last progress marker and the first error line go into one.
        #
        # Deliberately free of python3, jq, and anything else this pipeline
        # installs: the failure most worth reporting is the one that happened
        # before the installs finished. `tr` and `sed` are in coreutils.
        # Borrowed from ../selfsame; delete it the day the instance grows a log
        # endpoint.
        if: failure()
        continue-on-error: true
        run: |
          set +e
          where=$(grep -E '^MARKER: ' /tmp/circus-ci.log 2>/dev/null | tail -1 | sed 's/^MARKER: //')
          [ -n "$where" ] || where="before the first step wrote a marker"
          line=$(grep -m1 -E '^(error|E:|thread .* panicked|.*: command not found|.*No such file)' /tmp/circus-ci.log 2>/dev/null)
          [ -n "$line" ] || line=$(tail -n 2 /tmp/circus-ci.log 2>/dev/null | tr '\n' ' ')
          [ -n "$line" ] || line="no output captured"
          desc=$(printf 'died in [%s]: %s' "$where" "$line" \
                 | tr -d '"\\' | tr '\n\r\t' '   ' | cut -c1-240)
          echo "reporting: ${desc}"
          curl -sS -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Content-Type: application/json" \
            "${GITHUB_SERVER_URL}/api/v1/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"context\":\"ci-diagnostic\",\"state\":\"failure\",\"description\":\"${desc}\"}" \
            || true
