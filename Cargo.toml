[package]
name = "circus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small local harness that runs coding-agent CLIs in isolated Git worktrees"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.test]
opt-level = 1
