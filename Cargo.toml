[package]
name = "circus"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "A small local harness that runs coding-agent CLIs in isolated Git worktrees"
license = "Apache-2.0"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[profile.release]
# The dependency tree is three pure-Rust crates, so full LTO costs a few
# seconds and needs none of the softening the heavier Anuna pipelines apply to
# avoid OOM at cross-link time.
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 1
