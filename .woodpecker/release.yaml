#
# circus release pipeline.
#
# Triggered by pushing a tag like `v0.1.0` (see ./release.sh). Cross-compiles
# the four prebuilt binaries that scripts/install.sh downloads
#   circus-darwin-arm64  circus-darwin-x64  circus-linux-x64  circus-linux-arm64
# each with a matching .sha256, then publishes them (plus install.sh) to
# Cloudflare R2 (bucket anuna-files) so they are served at
#   https://files.anuna.io/circus/            <- flat "latest", what install.sh reads
#   https://files.anuna.io/circus/<tag>/      <- immutable per-release archive
#
# Everything builds from Linux rust:1-bookworm containers, including the darwin
# artifacts (via osxcross + the macOS SDK) — the hosted runners are Linux-only.
#
# Two things make this simpler than the elephant pipeline it is modelled on.
# circus has no sibling path dependencies, so there are no *_REF pins to keep in
# step with Cargo.lock and `--locked` alone pins the whole tree. And its three
# dependencies (clap, serde, serde_json) are pure Rust with no C in them, so no
# cross build needs a target C toolchain, an SDK for libssl, or the thin-LTO
# softening the heavier pipelines apply to avoid OOM at link.
#
# What is NOT built here is the test suite. circus's tests drive real Git, tmux,
# and withdone, which the cross targets cannot run from a Linux container. The
# gate for that is .woodpecker/ci.yaml on the way to the tag, and ./release.sh
# refuses to tag until it passes locally.
#
# Required Woodpecker secrets (the same R2 credentials the elephant, hark, and
# zetl pipelines use):
#   cf_r2_access_key_id  cf_r2_secret_access_key  cf_account_id

when:
  - event: tag
    branch: main

variables:
  - &rust_image rust:1-bookworm

steps:
  - name: build-linux-x64
    image: *rust_image
    commands:
      - cargo build --release --locked --target x86_64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/x86_64-unknown-linux-gnu/release/circus dist/circus-linux-x64
      - cd dist && sha256sum circus-linux-x64 > circus-linux-x64.sha256 && cd ..

  - name: build-linux-arm64
    image: *rust_image
    commands:
      # No C in the dependency tree, so the cross toolchain is needed only for
      # the final link.
      - apt-get update && apt-get install -y gcc-aarch64-linux-gnu
      - rustup target add aarch64-unknown-linux-gnu
      - export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
      - cargo build --release --locked --target aarch64-unknown-linux-gnu
      - mkdir -p dist
      - cp target/aarch64-unknown-linux-gnu/release/circus dist/circus-linux-arm64
      - cd dist && sha256sum circus-linux-arm64 > circus-linux-arm64.sha256 && cd ..

  - name: build-darwin-arm64
    image: *rust_image
    commands:
      - apt-get update && apt-get install -y clang cmake patch xz-utils libxml2-dev
      - rustup target add aarch64-apple-darwin
      - |
        # Build the osxcross toolchain against the macOS SDK. Keep the SDK
        # download, the PATH/CC exports and the cargo build in one shell block
        # so the cross environment is still in scope at link time. A YAML
        # anchor cannot be shared here: inside a block scalar it would be
        # literal text, not a reference.
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        cd -
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang
        export CXX_aarch64_apple_darwin=aarch64-apple-darwin23.5-clang++
        export CARGO_TARGET_AARCH64_APPLE_DARWIN_LINKER=aarch64-apple-darwin23.5-clang
        cargo build --release --locked --target aarch64-apple-darwin
        mkdir -p dist
        cp target/aarch64-apple-darwin/release/circus dist/circus-darwin-arm64
        cd dist && sha256sum circus-darwin-arm64 > circus-darwin-arm64.sha256 && cd ..

  - name: build-darwin-x64
    image: *rust_image
    commands:
      - apt-get update && apt-get install -y clang cmake patch xz-utils libxml2-dev
      - rustup target add x86_64-apple-darwin
      - |
        # Build the osxcross toolchain against the macOS SDK. Keep the SDK
        # download, the PATH/CC exports and the cargo build in one shell block
        # so the cross environment is still in scope at link time. A YAML
        # anchor cannot be shared here: inside a block scalar it would be
        # literal text, not a reference.
        [ -d /tmp/osxcross ] || git clone https://github.com/tpoechtrager/osxcross /tmp/osxcross
        cd /tmp/osxcross
        curl -fsSL https://github.com/joseluisq/macosx-sdks/releases/download/14.5/MacOSX14.5.sdk.tar.xz -o tarballs/MacOSX14.5.sdk.tar.xz
        UNATTENDED=1 ./build.sh
        cd -
        export PATH="/tmp/osxcross/target/bin:$PATH"
        export CC_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang
        export CXX_x86_64_apple_darwin=x86_64-apple-darwin23.5-clang++
        export CARGO_TARGET_X86_64_APPLE_DARWIN_LINKER=x86_64-apple-darwin23.5-clang
        cargo build --release --locked --target x86_64-apple-darwin
        mkdir -p dist
        cp target/x86_64-apple-darwin/release/circus dist/circus-darwin-x64
        cd dist && sha256sum circus-darwin-x64 > circus-darwin-x64.sha256 && cd ..

  - name: create-metadata
    image: alpine:3
    commands:
      - apk add --no-cache coreutils
      # The installer the curl one-liner fetches, shipped alongside the binaries.
      - cp scripts/install.sh dist/install.sh
      # The example drivers. They are not installed by install.sh — a driver is
      # a choice, and SPEC-001-circus-agent-harness#REQ-007.b keeps provider
      # knowledge out of circus itself. Publishing them makes the four known-good
      # ones fetchable without cloning.
      - mkdir -p dist/drivers
      - cp drivers/circus-driver-* dist/drivers/
      - cp drivers/README.md dist/drivers/README.md
      - |
        cat > dist/version.json << EOF
        {
          "version": "${CI_COMMIT_TAG#v}",
          "download_url": "https://files.anuna.io/circus/${CI_COMMIT_TAG}"
        }
        EOF
      - ls -la dist/

  - name: upload-to-cloudflare-r2
    image: amazon/aws-cli:2.15.0
    environment:
      AWS_ACCESS_KEY_ID:
        from_secret: cf_r2_access_key_id
      AWS_SECRET_ACCESS_KEY:
        from_secret: cf_r2_secret_access_key
      CF_ACCOUNT_ID:
        from_secret: cf_account_id
    commands:
      - export AWS_DEFAULT_REGION=auto
      - export R2_ENDPOINT="https://$${CF_ACCOUNT_ID}.r2.cloudflarestorage.com"
      - export BUCKET="anuna-files"
      - export PROJECT="circus"

      # Flat prefix = the "latest" the curl installer reads
      # (https://files.anuna.io/circus/circus-<os>-<arch> and .../install.sh),
      # plus an immutable per-tag archive at circus/<tag>/.
      - |
        for file in dist/circus-* dist/install.sh dist/version.json; do
          [ -f "$$file" ] || continue
          name=$$(basename "$$file")
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$$name"                    --endpoint-url "$$R2_ENDPOINT"
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/$$name"  --endpoint-url "$$R2_ENDPOINT"
          echo "Uploaded: $$name"
        done
      - |
        for file in dist/drivers/*; do
          [ -f "$$file" ] || continue
          name=$$(basename "$$file")
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/drivers/$$name"                    --endpoint-url "$$R2_ENDPOINT"
          aws s3 cp "$$file" "s3://$${BUCKET}/$${PROJECT}/$${CI_COMMIT_TAG}/drivers/$$name"  --endpoint-url "$$R2_ENDPOINT"
          echo "Uploaded: drivers/$$name"
        done

      # Informational only, and non-fatal: an "Object Read & Write" R2 token can
      # PutObject (the uploads above) but may lack bucket ListBucket, and this
      # step runs under `set -e`.
      - echo "Files in $${PROJECT}/ (latest):"
      - aws s3 ls "s3://$${BUCKET}/$${PROJECT}/" --endpoint-url "$$R2_ENDPOINT" || echo "(list not permitted by this token; the uploads above succeeded)"
      - echo ""
      - echo "Release available at:"
      - echo "  https://files.anuna.io/$${PROJECT}/"
      - echo "  https://files.anuna.io/$${PROJECT}/$${CI_COMMIT_TAG}/"
      - 'echo "Install: curl https://files.anuna.io/$${PROJECT}/install.sh | sh"'
